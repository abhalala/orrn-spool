name: Release ORRN Edge Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit semver release (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="${{ github.event.inputs.version || '1.0.0' }}"
          fi
          if [[ -z "$ver" || "$ver" == "dev" || ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must match semver X.Y.Z" >&2
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${ver}" >> "$GITHUB_OUTPUT"

  docker:
    needs: prep
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.prep.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orrn-edge:${{ needs.prep.outputs.version }}

  smoke:
    needs: prep
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go runtime and execute native release artifact
        shell: bash
        run: |
          go test ./...
          bash scripts/release_test.sh "${{ needs.prep.outputs.version }}"

  release:
    needs: [prep, docker, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release artifacts and manifest
        env:
          OUT_DIR: dist
        run: |
          bash scripts/build-release.sh "${{ needs.prep.outputs.version }}"
          bash scripts/release-manifest.sh "${{ needs.prep.outputs.version }}" "ghcr.io/${{ github.repository_owner }}/orrn-edge@${{ needs.docker.outputs.digest }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prep.outputs.release_tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORRN Edge v${{ needs.prep.outputs.version }}" \
            --notes "Immutable SHA-256 verified ORRN Edge release v${{ needs.prep.outputs.version }}"
