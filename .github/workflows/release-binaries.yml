name: Release Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
    steps:
      - id: meta
        run: |
          echo "release_tag=main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "release_title=main ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runs_on: ubuntu-latest
            shell: bash
            goos: linux
            goarch: amd64
            output: orrn-spool-linux-amd64
            cc: ""
          - platform: darwin-amd64
            runs_on: macos-14
            shell: bash
            goos: darwin
            goarch: amd64
            output: orrn-spool-darwin-amd64
            cc: ""
          - platform: darwin-arm64
            runs_on: macos-14
            shell: bash
            goos: darwin
            goarch: arm64
            output: orrn-spool-darwin-arm64
            cc: ""
          - platform: windows-amd64
            runs_on: windows-latest
            shell: pwsh
            goos: windows
            goarch: amd64
            output: orrn-spool-windows-amd64.exe
            cc: gcc
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.platform == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-ucrt-x86_64-gcc
      - if: matrix.platform == 'windows-amd64'
        name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download modules
        run: go mod download
      - if: matrix.platform != 'windows-amd64'
        name: Build binary
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -ldflags "-w -s" -o "dist/${{ matrix.output }}" ./cmd/spool
      - if: matrix.platform == 'windows-amd64'
        name: Build binary (Windows)
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-w -s" -o "dist/${{ matrix.output }}" ./cmd/spool
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.output }}

  docker:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prep.outputs.release_tag }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: [prep, build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -maxdepth 2 -type f -exec cp {} release/ \;
          cd release
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prep.outputs.release_tag }}" release/*             --repo "$GITHUB_REPOSITORY"             --title "${{ needs.prep.outputs.release_title }}"             --notes "Automated binary and Docker release for commit ${GITHUB_SHA}."
