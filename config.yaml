server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

database:
  path: ./data/spool.db
  archive_path: ./data/archives
  archive_days: 30

printers:
  health_check_interval: 30s
  connection_timeout: 10s
  status_poll_interval: 5s

queue:
  max_retries: 3
  retry_delay: 10s
  worker_count: 2

logging:
  level: info
  format: json

# Weighing scale at the packing bay (receive only; the spool never writes to it).
# Leave device empty for no scale. See docs/scale-and-orrn-auth.md.
# scale:
#   device: /dev/ttyUSB0        # or COM3 on Windows, or tcp://10.0.0.50:4001
#   baud: 9600
#   data_bits: 8
#   parity: none                # none | even | odd
#   stop_bits: 1
#   frame: '^(?:(?P<status>ST|US)\s*,\s*)?(?:(?P<mode>GS|NT|GR|TR)\s*,\s*)?(?P<kg>[+-]?\s*\d+(?:\.\d+)?)\s*kg\s*$'
#   simulate: false             # true (or --scale-sim) serves simulated frames
#
# Link to ORRN (the install script sets these as ORRN_SPOOL_* env vars instead).
# orrn:
#   instance_id: ""
#   subdomain: ""
#   server_url: ""
#   shared_secret: ""
#   heartbeat_interval: 60s
