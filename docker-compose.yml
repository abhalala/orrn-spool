version: "2.4"

services:
  orrn-edge:
    image: "${ORRN_EDGE_IMAGE}"
    container_name: orrn-edge
    restart: unless-stopped
    ports:
      - "${ORRN_EDGE_FALLBACK_PORT}:8080"
    volumes:
      - orrn-edge-data:/var/lib/orrn-edge
      - ${ORRN_ENROLL_TOKEN_FILE}:/run/orrn-edge/enrollment-token:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /var/lib/orrn-edge/node.json ]; then
          /usr/local/bin/orrn-edge enroll --state-dir /var/lib/orrn-edge --api-origin "$${ORRN_API_ORIGIN:-https://api.orrn.in}" --token-file /run/orrn-edge/enrollment-token
          truncate -s 0 /run/orrn-edge/enrollment-token
        fi
        exec /usr/local/bin/orrn-edge run --state-dir /var/lib/orrn-edge --admin-addr 127.0.0.1:8081 --fallback-addr :8080
    environment:
      - ORRN_EDGE_STATE_DIR=/var/lib/orrn-edge
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "/usr/local/bin/orrn-edge", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  orrn-edge-data:
